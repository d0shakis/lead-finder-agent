[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lead-finder-agent"
version = "0.1.0"
description = "AI agent that finds local businesses on OpenStreetMap, audits their websites and scores them as sales leads."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.6",
    "typer>=0.12",
    "rich>=13",
    "beautifulsoup4>=4.12",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
claude = ["anthropic>=0.40"]
openai = ["openai>=1.40"]
ui = ["streamlit>=1.35", "pandas>=2.0"]
all = ["anthropic>=0.40", "openai>=1.40", "streamlit>=1.35", "pandas>=2.0"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "respx>=0.21", "ruff>=0.6"]

[project.scripts]
leadfinder = "leadfinder.cli:app"

[tool.setuptools.packages.find]
include = ["leadfinder*"]

[tool.setuptools.package-data]
"leadfinder.data" = ["*.json"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E741", "B008"]  # short loop names; typer uses calls in defaults

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
